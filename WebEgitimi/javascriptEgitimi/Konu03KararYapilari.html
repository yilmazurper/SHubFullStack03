<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Konu03KararYapilari</title>
</head>
<body>
    <h1>Konu03KararYapilari</h1>
    <h1>js Konu03 Karar Yapilari</h1>
    <p>
        program kadlarimizi icerige gore yonlendirmemizi saglayan if , else if, else ve switch case yapisi
    </p>
    <script>
        var sayi = 18;
        console.warn("sayi:", sayi);
        if (sayi > 0) {
            console.log("sayi pozitif");
        }
        else if (sayi == 0) {
            console.log("sayi sifir");
        }
        else {
            console.log("sayi negatif");
        }

        //ternary operatoru kullanimi
        console.log('ternary operatoru kullanimi : >>')
        console.warn(sayi > 0 ? "sayi pozitif" : "sayi negatif");
        //switch case
        switch (sayi) {
            case 18: console.log("sayi pozitif")
                break;
            case -18: console.log("sayi negatif")
                break;
            default: console.log("sayi sifir")
                break;




        }















    </script>

</body>
</html>
