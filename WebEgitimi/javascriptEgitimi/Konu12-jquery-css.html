<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Konu12-jquery-css</title>
    <style>
        .baslik { color: red ; front-size: larger }
        .renk {color: crimson}
        .brd{ border: 1px dashed blue; min-height: 1rem;}
    </style>
    <script src="../Scripts/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Konu12-jquery ile -css islemleri</h1>

    <h3 id="jqilegizel">bu element jquery ile gizlencek</h3>
    <h3 id="jsilegizle">bu elemnt javascript ile gizlencek</h3>

    <script>
        //sayfadaki elemenleri gizleme
        $("jqilegizle").hide()
        document.getElementById("jsilegizele").style.display = "none"

        // sayfadaki elementleri gosterme
        $("#jqilegizle").show()
        document.getElementById("jsilegizle"),style.display =""
    </script>

    <hr />
    
    <h2>elemntlerin css lerin degistirme</h2>

    <div id=" jqsekillendir" class="renk test brd">
        elemntlerin css lerini degitirme
    </div>
    <div id="jssekillendir" class="renk test brd">
        elemenlerin CSS lerini degistirme
    </div>
    <script>
        //jqery ile elemntlere css uygulama
        $("#jqsekillendir").css("front-size","34px")
        $("#jqsekillendir").css("padding", "34px")


        //jquery ile elementlere claaa ekleme
        $("h2:first").addClass("baslik")
        $("#jqsekillendir").addClass("jsclass deneme") // birden fazla class da ekleyebiblrirz
        $("#jqsekillendir").removeClass("renk")

        //javascript ile css verme
        document.getElementByid("jssekillendir").style.color = "blue"
        document.getElementByid("jssekillendir").style.padding = "1rem"
        document.getElementByid("jssekillendir").style.margin = "1.8rem"

        //javascript ile elementlere class ekleme cikarma 
        document.getElementById("jssekillendir").classlist.add("baslik")
        document.getElementById("jssekillendir").classlist.remove("test")

    </script>






</body>
</html>
