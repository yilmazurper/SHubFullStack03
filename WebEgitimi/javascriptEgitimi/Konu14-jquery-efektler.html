<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Konu14-jquery-efektler</title>
    <script src="../Scripts/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Konu14-jquery-efektler</h1>

    <input type="button" id="button1" value="fade out" />
    <input type="button" id="button2" value="fade in" />
    <input type="button" id="button3" value="fade to" />
    <button>id="button4">Fade Toggle</button>

    <div id="box" style="background-color: green; height: 100px; width: 100px; margin:1rem; padding:1rem; color: beige;">
        <h2>jquery de efekt kullanimi</h2>
    </div>

    <script>
        $("#buton1").on("click", function () {
            $("h1").fadeout()
            $("box").fadeout()

        });
        $("#buton2").on("click", function () {
            $("h1").fadein()
            $("box").fadein()

        });
        $("#buton3").on("click", function () {
            $("h1").fadeto(1000, 0.7)
            $("box").fadeto(1180, 0.5)

        });
        $("#buton3").on("click", function () {
            $("h1").fadeToggle()
            $("box").fadeToggle()

        });
    </script>
    <hr />

    <input type="button" id="button5" value="yukseklik animasyonu" />
    <input type="button" id="button6" value="animasyonu sifirla" />


    <script>
        $("#buton5").on("click", function () {
      
            $("box").animate({"height":"180px" })

        });

        $("#buton6").on("click", function () {

            $("box").animate({ "height": "100px" })

        });
    </script>

    <h2>yukari cik uygulamasi</h2>
    <div style="height:118vh">
        yukari cik yazisina tiklayarak sayfayi yukari kaydirma
    </div>

    <a href="#" class="backotop">yukari cik</a>
    <style>
        .backotop { position: fixed; bottom: 18px; right:34px; }
    </style>
    <script>
        $(function ()
        {
            $(window).scroll(function () {
                if ($(window).scrolltop() > 100)
                {


                    $(".backotop").fadein()
                }
                else
                {

                    $(".backotop").fadeout()
                }
            });

            $(".backotop").on("click", function ()
            {
                $("html,body").animate({ scrollTop: 0 })
            });

        });

    </script>

</body>
</html>
