<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Konu15-jquery-ajax</title>
    <script src="../Scripts/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Konu15-jquery-ajax</h1>
    <p>
        AJAX, intenet sayfalrinda javascript ve XMLhttpRequest kullanimi ile etkilsimli uygiarlamlar olusturmaizi saglayan yonetimin adidir
    </p>
    <p>
        AJAx uygulariminda hizlanmaya ve veri kullanimini azaltmaya yardimci olur
    </p>
    <form action="" method="get">
        <input type="text" name="urunAdi" placeholder="Urun Adi" />
        <input type="text" name="urunFiyati" placeholder="Urun Fiyati" />
        <input type="submit" value="kaydet" />
    </form>

    <hr />
    <p id="ajax" style="border:thin solid red"></p>
    <input type="button" id="getir" value="ajax ile icerik getir" />

    <script>

        $("#getir").click(function () {
            $.ajax({
                url: "Ajaxicerik.txt", // ajax istegini gondericegimiz adres
                success: function (sonuc) { //islem basarili olursa calicek kod blogu
                    $("#ajax").html(sonuc)
                },
                error: function () { // islem basarisuz olursa calicscak kod blogu
                    $("#ajax").htmk("hata olustu!!")
                    console.error("hata olustu")
                }
            })
        });








    </script>







</body>
</html>
