<!DOCTYPE html>

<head>

    <title>konu02operatorler</title>
</head>
<body>
    <h1>konu02operatorler</h1>
    <h2>aritmetik operatiorler</h2>
    <p>
        matemayiksel islmeler icin kullanilir
    </p>
    <script>
        let sayi1 = 10;
        let sayi2 = 8;
        console.error("sayi 1 :" + sayi1 + "sayi 2:" + sayi2);
        console.log("sayi 1+sayi 2=", sayi1 + sayi2);
        console.log("sayi 1+sayi 2=" + sayi1 + sayi2); //burada string degerler sayisal degeri birlstityor
        console.log("sayi(sayi1+sayi2)=" + (sayi1 + sayi2)); //bilestirmeyi engellmek icin

        console.log("sayi 1- sayi 2=", sayi1 - sayi2);
        console.log("sayi 1*sayi 2=", sayi1 * sayi2);
        console.log("sayi 1/ sayi 2=", sayi1 /  sayi2);
        console.log("sayi 1 % sayi 2=", sayi1 % sayi2);

    </script>


</body>
